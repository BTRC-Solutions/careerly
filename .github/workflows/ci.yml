name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test and build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows is the priority platform (RNF-17); Ubuntu catches path and case-sensitivity issues.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Same major version as the Node.js bundled with Electron.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Pinned Typst CLI (scripts/fetch-typst.mjs) so the template tests render real PDFs.
      - uses: actions/cache@v4
        with:
          path: vendor/typst
          key: typst-${{ runner.os }}-${{ hashFiles('scripts/fetch-typst.mjs') }}
      - run: npm run typst:fetch

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:telemetry

  # The VPS's configuration (infra/telemetry, ARCHITECTURE §19.6), checked without deploying anything.
  infra:
    name: Telemetry infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compose file
        run: |
          docker network create edge
          printf '%s\n' CAREERLY_DOMAIN=example.test POSTGRES_PASSWORD=x TELEMETRY_DB_PASSWORD=x \
            TELEMETRY_INTERNAL_SECRET=ci-internal-secret-shared-by-both-services > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f infra/telemetry/compose.yaml --profile migrate config --quiet

      - name: Caddy site
        run: |
          # Wrapped as kleinkauf's Caddyfile imports it, with the domain deploy.sh puts in.
          mkdir /tmp/caddy
          sed 's/__CAREERLY_DOMAIN__/careerly-127-0-0-1.sslip.io/' infra/telemetry/careerly.caddy > /tmp/caddy/careerly.caddy
          printf 'import /etc/caddy/careerly.caddy\n' > /tmp/caddy/Caddyfile
          docker run --rm -v /tmp/caddy:/etc/caddy:ro caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Scripts
        run: shellcheck infra/telemetry/deploy.sh infra/telemetry/postgres/init-roles.sh
